name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install binaryen (pinned v117)
        run: |
          # Pin to v117 — newer versions have had miscompile issues with CF Workers
          BINARYEN_VERSION=117
          wget -q "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          tar -xzf "binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          sudo mv "binaryen-version_${BINARYEN_VERSION}/bin/"* /usr/local/bin/
          wasm-opt --version

      - name: Install worker-build
        run: cargo install worker-build

      - name: Build
        run: bash build.sh

      - name: Run unit tests (native target)
        run: cargo test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}

      - name: Smoke test — trigger cron and verify KV write
        run: |
          sleep 10  # wait for deploy to propagate
          # Trigger the scheduled event via CF API
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/rss-worker/schedules" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" || true
          sleep 15  # wait for cron to run
          # Verify meta:last-run was written to KV
          RESULT=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.KV_NAMESPACE_ID }}/values/meta:last-run" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}")
          echo "Last run metadata: $RESULT"
          echo "$RESULT" | grep -q '"success"' || { echo "ERROR: meta:last-run missing or malformed"; exit 1; }
